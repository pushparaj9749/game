# ---- Versioning (single source of truth) ----
# Bump VERSION_CODE for every Play Store upload; it must always increase.
VERSION_CODE=1
VERSION_NAME=1.0.0
APP_ID=com.pushparaj.rickshawrush

# ---- Gradle ----
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is off on purpose: it saves ~20s but is the #1 cause of
# mysterious AGP failures in CI. Turn it on later once builds are stable.
org.gradle.configuration-cache=false

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true
