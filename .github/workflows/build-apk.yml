name: Build APK

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so you don't queue up stale builds.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Everything the Android build needs is preinstalled on the GitHub-hosted
  # ubuntu-latest image: JDK 17 (default), Gradle, SDK platforms 34-37,
  # build-tools 34/35/36/37, platform-tools and NDK.
  JAVA_VERSION: '17'

jobs:
  build:
    name: assembleDebug + assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk${{ env.JAVA_VERSION }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-jdk${{ env.JAVA_VERSION }}-

      - name: Show toolchain
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          chmod +x ./gradlew

      # ---------------------------------------------------------------
      # Optional: sign the release build in CI.
      # Skipped unless you add the KEYSTORE_* secrets, in which case the
      # signed app-release.apk is produced instead of the unsigned one.
      # ---------------------------------------------------------------
      - name: Build APKs
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/RickshawRush-debug.apk"

          if ls app/build/outputs/apk/release/*-unsigned.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*-unsigned.apk "out/RickshawRush-release-UNSIGNED.apk"
          else
            cp app/build/outputs/apk/release/*.apk "out/RickshawRush-release.apk"
          fi

          ( cd out && sha256sum *.apk > SHA256SUMS.txt )

          # Version info is read from gradle.properties (single source of truth).
          echo "version_name=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_ENV"
          echo "version_code=$(grep '^VERSION_CODE=' gradle.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_ENV"

          ls -la out
          cat out/SHA256SUMS.txt

      - name: APK size report
        run: |
          {
            echo "### APK build :package:"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in out/*.apk; do
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo ""
            echo "- versionName: \`${{ env.version_name }}\`"
            echo "- versionCode: \`${{ env.version_code }}\`"
            echo ""
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: RickshawRush-v${{ env.version_name }}-${{ github.sha }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
