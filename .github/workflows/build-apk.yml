name: Build APK

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so stale builds don't queue up.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug + assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image already ships the Android SDK (platforms 34-37,
      # build-tools 34-37, platform-tools, NDK) and Gradle, so there is nothing
      # to install and no sdkmanager licences to accept.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-j17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-j17-

      - name: Toolchain
        run: |
          java -version 2>&1
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "platforms:  $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"
          chmod +x ./gradlew
          ./gradlew --version 2>&1 | sed -n '1,12p' || true

      # KEYSTORE_* secrets are optional. Without them the release build stays
      # unsigned and you sign it yourself; with them CI signs it for you.
      - name: Build APKs
        id: build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Collect APKs
        if: success()
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/RickshawRush-debug.apk"
          if ls app/build/outputs/apk/release/*-unsigned.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*-unsigned.apk "out/RickshawRush-release-UNSIGNED.apk"
          else
            cp app/build/outputs/apk/release/*.apk "out/RickshawRush-release.apk"
          fi
          ( cd out && sha256sum *.apk > SHA256SUMS.txt )
          echo "version_name=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_ENV"
          echo "version_code=$(grep '^VERSION_CODE=' gradle.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_ENV"
          ls -la out
          cat out/SHA256SUMS.txt

      # Always runs: this is the only failure detail reachable without the
      # (separately hosted) raw log endpoint, so it goes into the job summary.
      - name: Report
        if: always()
        run: |
          {
            if [ ! -f build.log ]; then
              echo "### :x: Build never produced a log"
              exit 0
            fi
            if grep -qE "^BUILD SUCCESSFUL" build.log; then
              echo "### :white_check_mark: Build successful"
            else
              echo "### :x: Build FAILED"
            fi
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in out/*.apk; do
              [ -e "$f" ] || continue
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            [ -n "${version_name:-}" ] && echo "" && echo "versionName \`${version_name}\` / versionCode \`${version_code}\`"
            echo ""
            echo "#### Compile errors"
            echo '```'
            grep -nE "error:|ERROR:|e: " build.log | head -80 || echo "(none matched)"
            echo '```'
            echo ""
            echo "#### What went wrong"
            echo '```'
            awk '/^FAILURE: Build (failed|completed with an exception)/{f=1} f' build.log | head -120
            echo '```'
            echo ""
            echo "#### Failed tasks"
            echo '```'
            grep -E "^> Task .* FAILED" build.log | head -30 || echo "(none)"
            echo '```'
            echo ""
            echo "<details><summary>last 250 log lines</summary>"
            echo ""
            echo '```'
            tail -250 build.log
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # Failure debugging aid.
      #
      # Raw Actions logs are served from a different host than api.github.com,
      # which is unreachable from restricted environments. So on failure this
      # posts the digest two ways that ARE reachable through the API:
      #   1. a commit comment   -> GET /repos/OWNER/REPO/commits/SHA/comments
      #   2. an error annotation -> GET /repos/OWNER/REPO/check-runs/JOB/annotations
      # Both are best-effort: the step can never fail the job.
      # Safe to delete once the build is stable.
      # ---------------------------------------------------------------
      - name: Report failure via API
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          [ -f build.log ] || { echo "no build.log produced"; exit 0; }

          BODY_FILE=$(mktemp)
          {
            echo "### :x: Build failure digest"
            echo ""
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "#### What went wrong"
            echo '```'
            awk '/^FAILURE: Build (failed|completed with an exception)/{f=1} f' build.log | head -60
            echo '```'
            echo ""
            echo "#### Errors"
            echo '```'
            grep -nE "error:|ERROR:|^e: |Caused by: " build.log | head -60
            echo '```'
            echo ""
            echo "#### Failed tasks"
            echo '```'
            grep -E "^> Task .* FAILED" build.log | head -30
            echo '```'
            echo ""
            echo "<details><summary>last 120 log lines</summary>"
            echo ""
            echo '```'
            tail -120 build.log
            echo '```'
            echo "</details>"
          } > "$BODY_FILE"

          # 1) commit comment
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -X POST -F body=@"$BODY_FILE" --jq '.html_url' \
            || echo "::warning::could not post commit comment"

          # 2) an ::error annotation, readable via
          #    GET /repos/OWNER/REPO/check-runs/JOB_ID/annotations
          MSG=$(awk '/^FAILURE: Build (failed|completed with an exception)/{f=1} f' build.log \
                  | head -45 | cut -c1-300)
          [ -n "$MSG" ] || MSG=$(grep -nE "error:|FAILED" build.log | head -45 | cut -c1-300)
          [ -n "$MSG" ] || MSG="build failed; see the build.log artifact"
          echo "::error title=Gradle failure::$(printf '%s' "$MSG" | head -c 1500 | tr '\n' ' ')"
          exit 0

      - name: Upload APKs + build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RickshawRush-v${{ env.version_name || 'failed' }}-${{ github.sha }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
            build.log
          if-no-files-found: warn
          retention-days: 30
