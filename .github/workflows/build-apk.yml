name: Build APK

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so stale builds don't queue up.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # `write` is only needed so the failure-debug step can push the build log to
  # the orphan ci-logs branch. Nothing is ever pushed to a source branch.
  contents: write

jobs:
  build:
    name: assembleDebug + assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image already ships the Android SDK (platforms 34-37,
      # build-tools 34-37, platform-tools, NDK) and Gradle, so there is nothing
      # to install and no sdkmanager licences to accept.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-j17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-j17-

      - name: Toolchain
        run: |
          java -version 2>&1
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "platforms:  $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"
          chmod +x ./gradlew
          ./gradlew --version 2>&1 | sed -n '1,12p' || true

      # KEYSTORE_* secrets are optional. Without them the release build stays
      # unsigned and you sign it yourself; with them CI signs it for you.
      - name: Build APKs
        id: build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Collect APKs
        if: success()
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/RickshawRush-debug.apk"
          if ls app/build/outputs/apk/release/*-unsigned.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*-unsigned.apk "out/RickshawRush-release-UNSIGNED.apk"
          else
            cp app/build/outputs/apk/release/*.apk "out/RickshawRush-release.apk"
          fi
          ( cd out && sha256sum *.apk > SHA256SUMS.txt )
          echo "version_name=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_ENV"
          echo "version_code=$(grep '^VERSION_CODE=' gradle.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_ENV"
          ls -la out
          cat out/SHA256SUMS.txt

      # Always runs: this is the only failure detail reachable without the
      # (separately hosted) raw log endpoint, so it goes into the job summary.
      - name: Report
        if: always()
        run: |
          {
            if [ ! -f build.log ]; then
              echo "### :x: Build never produced a log"
              exit 0
            fi
            if grep -qE "^BUILD SUCCESSFUL" build.log; then
              echo "### :white_check_mark: Build successful"
            else
              echo "### :x: Build FAILED"
            fi
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in out/*.apk; do
              [ -e "$f" ] || continue
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            [ -n "${version_name:-}" ] && echo "" && echo "versionName \`${version_name}\` / versionCode \`${version_code}\`"
            echo ""
            echo "#### Compile errors"
            echo '```'
            grep -nE "error:|ERROR:|e: " build.log | head -80 || echo "(none matched)"
            echo '```'
            echo ""
            echo "#### What went wrong"
            echo '```'
            awk '/^FAILURE: Build (failed|completed with an exception)/{f=1} f' build.log | head -120
            echo '```'
            echo ""
            echo "#### Failed tasks"
            echo '```'
            grep -E "^> Task .* FAILED" build.log | head -30 || echo "(none)"
            echo '```'
            echo ""
            echo "<details><summary>last 250 log lines</summary>"
            echo ""
            echo '```'
            tail -250 build.log
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # Failure debugging aid.
      #
      # Raw Actions logs are served from a different host than api.github.com
      # (productionresultssa*.blob.core.windows.net), which is awkward to reach
      # from restricted environments. This step mirrors build.log onto an
      # orphan `ci-logs` branch so it can be read back with plain
      # `gh api repos/OWNER/REPO/contents/build.log?ref=ci-logs`.
      #
      # Only runs on failure. Safe to delete once the build is stable.
      # ---------------------------------------------------------------
      - name: Publish build log on failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p .cilogs
          cp -f build.log .cilogs/ 2>/dev/null || echo "(no build.log)" > .cilogs/build.log

          {
            echo "# Build failure digest"
            echo ""
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- branch: \`${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}\`"
            echo ""
            echo "## What went wrong"
            echo '```'
            awk '/^FAILURE: Build (failed|completed with an exception)/{f=1} f' build.log 2>/dev/null | head -200
            echo '```'
            echo ""
            echo "## Errors"
            echo '```'
            grep -nE "error:|ERROR:|Caused by:|^e: " build.log 2>/dev/null | head -120 || echo "(none)"
            echo '```'
            echo ""
            echo "## Failed tasks"
            echo '```'
            grep -E "^> Task .* FAILED" build.log 2>/dev/null | head -40 || echo "(none)"
            echo '```'
            echo ""
            echo "## Gradle version block"
            echo '```'
            sed -n '1,40p' build.log
            echo '```'
          } > .cilogs/FAIL.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan ci-logs
          git reset -q
          git add -f .cilogs
          git commit -q -m "ci-logs: ${GITHUB_SHA::7} run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
          git push -f origin ci-logs:ci-logs

      - name: Upload APKs + build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RickshawRush-v${{ env.version_name || 'failed' }}-${{ github.sha }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
            build.log
          if-no-files-found: warn
          retention-days: 30
